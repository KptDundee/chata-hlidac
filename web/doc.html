<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chata – návod</title>
<meta name="theme-color" content="#1a1a19">
<style>
:root{--bg:#f3f2ee;--surface:#fcfcfb;--text:#0b0b0b;--text2:#52514e;--muted:#8a8984;--line:#e4e3de;--s1:#2a78d6}
@media (prefers-color-scheme:dark){:root{--bg:#111110;--surface:#1a1a19;--text:#f0efec;--text2:#c3c2b7;--muted:#8c8b84;--line:#2c2c2a;--s1:#3987e5}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:820px;margin:0 auto;padding:16px 16px 60px}
nav{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:4px 0 14px;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:2}
nav a{color:var(--text2);text-decoration:none;border:1px solid var(--line);border-radius:10px;padding:6px 12px;background:var(--surface)}
nav a[aria-current]{background:var(--text);color:var(--surface);font-weight:600;border-color:var(--text)}
nav .back{margin-right:auto}
article{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:6px 18px 18px;overflow-wrap:anywhere}
h1{font-size:22px;margin:14px 0 6px}
h2{font-size:18px;margin:22px 0 8px}
h3{font-size:15.5px;margin:18px 0 6px}
p,li{color:var(--text)}
code{background:var(--bg);border-radius:5px;padding:1px 5px;font-size:13.5px}
pre{background:var(--bg);border-radius:10px;padding:12px;overflow-x:auto;font-size:12px;line-height:1.35}
pre code{background:none;padding:0}
table{border-collapse:collapse;width:100%;font-size:13.5px;display:block;overflow-x:auto}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
th{color:var(--text2)}
hr{border:0;border-top:1px solid var(--line);margin:18px 0}
a{color:var(--s1)}
.sub{color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <nav>
    <a class="back" href="./">‹ Zpět</a>
    <a href="?d=navod" data-d="navod">Návod</a>
    <a href="?d=technicka" data-d="technicka">Technická</a>
    <a href="?d=CHANGELOG" data-d="CHANGELOG">Historie změn</a>
  </nav>
  <article id="doc"><p class="sub">Načítám…</p></article>
</div>
<script>
// Malý převaděč Markdownu (nadpisy, odstavce, seznamy, tabulky, kód, tučné, odkazy, čára) – bez cizích knihoven.
function md2html(md){
  const esc = t => t.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
  const inl = t => esc(t).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>")
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g,"$1<i>$2</i>").replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,'<a href="$2">$1</a>');
  const L = md.replace(/\r/g,"").split("\n"); let out = "", i = 0;
  while(i < L.length){
    let l = L[i];
    if(/^```/.test(l)){ let c=[]; i++; while(i<L.length && !/^```/.test(L[i])) c.push(L[i++]); i++; out += `<pre><code>${esc(c.join("\n"))}</code></pre>`; continue; }
    let h = l.match(/^(#{1,4})\s+(.*)/); if(h){ out += `<h${h[1].length}>${inl(h[2])}</h${h[1].length}>`; i++; continue; }
    if(/^---+\s*$/.test(l)){ out += "<hr>"; i++; continue; }
    if(/^\|/.test(l)){ const rows=[]; while(i<L.length && /^\|/.test(L[i])) rows.push(L[i++]);
      const cells = r => r.replace(/^\||\|\s*$/g,"").split("|").map(x=>x.trim());
      const body = rows.filter((r,j)=>!(j===1 && /^\|[\s:|-]+\|?\s*$/.test(r)));
      out += "<table><thead><tr>" + cells(body[0]).map(c=>`<th>${inl(c)}</th>`).join("") + "</tr></thead><tbody>"
        + body.slice(1).map(r=>"<tr>"+cells(r).map(c=>`<td>${inl(c)}</td>`).join("")+"</tr>").join("") + "</tbody></table>"; continue; }
    if(/^\s*([-*]|\d+\.)\s+/.test(l)){ const ord = /^\s*\d+\./.test(l); let items=[], cur=null;
      while(i<L.length && (/^\s*([-*]|\d+\.)\s+/.test(L[i]) || (/^\s{2,}\S/.test(L[i]) && cur!==null))){
        const m = L[i].match(/^(\s*)([-*]|\d+\.)\s+(.*)/);
        if(m){ cur = {d: m[1].length>=2, t: m[3]}; items.push(cur); } else cur.t += " " + L[i].trim();
        i++; }
      let html = "", sub = false;
      for(const it of items){ if(it.d && !sub){ html = html.replace(/<\/li>$/,""); html += "<ul>"; sub = true; }
        if(!it.d && sub){ html += "</ul></li>"; sub = false; }
        html += `<li>${inl(it.t)}</li>`; }
      if(sub) html += "</ul></li>";
      out += ord ? `<ol>${html}</ol>` : `<ul>${html}</ul>`; continue; }
    if(!l.trim()){ i++; continue; }
    let p=[]; while(i<L.length && L[i].trim() && !/^(#{1,4}\s|```|\||---+\s*$|\s*([-*]|\d+\.)\s+)/.test(L[i])) p.push(L[i++]);
    out += `<p>${inl(p.join(" "))}</p>`;
  }
  return out;
}
const names = {navod:"Návod", technicka:"Technická dokumentace", CHANGELOG:"Historie změn"};
const d = new URLSearchParams(location.search).get("d") || "navod";
const doc = names[d] ? d : "navod";
for (const a of document.querySelectorAll("nav a[data-d]")) if (a.dataset.d === doc) a.setAttribute("aria-current", "page");
document.title = "Chata – " + names[doc].toLowerCase();
fetch("docs/" + doc + ".md", {cache: "no-store"})
  .then(r => { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(md => {
    document.getElementById("doc").innerHTML = md2html(md);
  })
  .catch(e => { document.getElementById("doc").innerHTML = `<p class="sub">Dokument zatím není zveřejněný (${e.message}). Zkus to za pár minut.</p>`; });
</script>
</body>
</html>
