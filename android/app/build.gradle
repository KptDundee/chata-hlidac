plugins {
    id 'com.android.application'
}

android {
    namespace 'cz.petr.chatabrana'
    compileSdk 34

    defaultConfig {
        applicationId 'cz.petr.chatabrana'
        minSdk 31
        targetSdk 34
        versionCode 39
        versionName '1.9.8'
    }

    buildTypes {
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
