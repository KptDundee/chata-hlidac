plugins {
    id 'com.android.application'
}

// Ciferník ve formátu Watch Face Format: jen zdroje (XML + obrázky), žádný kód.
android {
    namespace 'cz.petr.chatacifernik'
    compileSdk 34

    defaultConfig {
        applicationId 'cz.petr.chatahodinky.cifernik'
        minSdk 34          // Wear OS 5+ (formát v2 kvůli počasí); Xiaomi Watch 5 má Wear OS 6
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    buildTypes {
        release { minifyEnabled false }
    }
}
