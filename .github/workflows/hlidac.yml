name: Hlídač chaty

on:
  schedule:
    - cron: "7,37 * * * *"   # každých 30 minut
  workflow_dispatch:
    inputs:
      test:
        description: "Poslat testovací upozornění"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: hlidac
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Kontrola baterie
        env:
          SG_ACCOUNT: ${{ secrets.SG_ACCOUNT }}
          SG_PASSWORD: ${{ secrets.SG_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.test && '1' || '0' }}
        run: python3 hlidac.py
      - name: Uložit stav
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "hlidac-bot"
            git config user.email "hlidac-bot@users.noreply.github.com"
            git add state.json
            git commit -m "stav hlídače"
            git push
          fi
