name: Hlídač chaty

on:
  schedule:
    - cron: "3-59/10 * * * *"   # každých 10 minut
  workflow_dispatch:
    inputs:
      test:
        description: "Poslat testovací upozornění"
        type: boolean
        default: false
      wake:
        description: "Probudit Flip (změřit hned)"
        type: boolean
        default: false
      flip:
        description: "Data z Flipu (1.4+: pole zpráv JSON; jinak prázdné)"
        type: string
        default: ""
      efset:
        description: "EcoFlow: nastavit nabíjecí výkon „konec SN:W“ (zkouška)"
        type: string
        default: ""
      gen:
        description: "Nabíjení z generátoru: start / stop"
        type: string
        default: ""

permissions:
  actions: write
  contents: write
  pages: write
  deployments: read

concurrency:
  group: hlidac
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4

      - name: Načíst historii
        run: |
          git fetch -q origin gh-pages --depth 1 && git show origin/gh-pages:data.enc > data.enc || rm -f data.enc
          pip install -q cryptography paho-mqtt

      - name: Kontrola baterie
        env:
          SG_ACCOUNT: ${{ secrets.SG_ACCOUNT }}
          SG_PASSWORD: ${{ secrets.SG_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DATA_KEY: ${{ secrets.DATA_KEY }}
          ECOFLOW_ACCESS_KEY: ${{ secrets.ECOFLOW_ACCESS_KEY }}
          ECOFLOW_SECRET_KEY: ${{ secrets.ECOFLOW_SECRET_KEY }}
          ECOFLOW_EMAIL: ${{ secrets.ECOFLOW_EMAIL }}
          ECOFLOW_PASSWORD: ${{ secrets.ECOFLOW_PASSWORD }}
          ECOFLOW_DEBUG: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.test && '1' || '0' }}
          WAKE: ${{ github.event_name == 'workflow_dispatch' && inputs.wake && '1' || '0' }}
          FLIP_DATA: ${{ github.event_name == 'workflow_dispatch' && inputs.flip || '' }}
          EF_SET: ${{ github.event_name == 'workflow_dispatch' && inputs.efset || '' }}
          GEN_CMD: ${{ github.event_name == 'workflow_dispatch' && inputs.gen || '' }}
          GH_TOKEN: ${{ github.token }}
        run: python3 hlidac.py

      - name: Odblokovat zaseknuté nasazení stránky
        # GitHub Pages občas zůstane viset na jednom nasazení („in progress“) a další pak odmítá → zrušit ho
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # zkusí zrušit posledních ~8 nasazení starších než 10 min (u dokončených to jen nic neudělá)
          gh api "repos/${{ github.repository }}/deployments?environment=github-pages&per_page=8" --jq '.[]|[.sha,.created_at]|@tsv' |
          while read sha created; do
            if [ $(( $(date +%s) - $(date -d "$created" +%s) )) -gt 600 ]; then
              gh api -X POST "repos/${{ github.repository }}/pages/deployments/$sha/cancel" >/dev/null 2>&1 && echo "Zrušeno nasazení $sha" || true
            fi
          done

      - name: Zveřejnit web
        if: always() && hashFiles('data.enc') != ''
        run: |
          mkdir -p pub/docs && cp web/* data.enc pub/ && cp docs/*.md CHANGELOG.md pub/docs/ && touch pub/.nojekyll
          cd pub && git init -q -b gh-pages && git add -A
          git -c user.name=hlidac-bot -c user.email=hlidac-bot@users.noreply.github.com commit -qm data
          ok=0
          for i in 1 2 3; do
            git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages && { ok=1; break; }
            echo "Zveřejnění se nepovedlo (pokus $i), zkouším znovu…"; sleep 15
          done
          [ "$ok" = 1 ]
