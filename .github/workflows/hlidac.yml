name: Hlídač chaty

on:
  schedule:
    - cron: "3-59/10 * * * *"   # každých 10 minut
  workflow_dispatch:
    inputs:
      test:
        description: "Poslat testovací upozornění"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  deployments: read

concurrency:
  group: hlidac
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Načíst historii
        run: |
          git fetch -q origin gh-pages --depth 1 && git show origin/gh-pages:data.enc > data.enc || rm -f data.enc
          pip install -q cryptography

      - name: Kontrola baterie
        env:
          SG_ACCOUNT: ${{ secrets.SG_ACCOUNT }}
          SG_PASSWORD: ${{ secrets.SG_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DATA_KEY: ${{ secrets.DATA_KEY }}
          ECOFLOW_ACCESS_KEY: ${{ secrets.ECOFLOW_ACCESS_KEY }}
          ECOFLOW_SECRET_KEY: ${{ secrets.ECOFLOW_SECRET_KEY }}
          ECOFLOW_DEBUG: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.test && '1' || '0' }}
        run: python3 hlidac.py

      - name: Odblokovat zaseknuté nasazení stránky
        # GitHub Pages občas zůstane viset na jednom nasazení („in progress“) a další pak odmítá → zrušit ho
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for sha in $(gh api "repos/${{ github.repository }}/deployments?environment=github-pages&per_page=6" --jq '.[].sha'); do
            st=$(gh api "repos/${{ github.repository }}/pages/deployments/$sha" --jq .status 2>/dev/null || true)
            case "$st" in
              deployment_in_progress|deployment_queued|syncing_files|updating_pages|pending)
                age=$(gh api "repos/${{ github.repository }}/deployments?sha=$sha&environment=github-pages" --jq '.[0].created_at')
                if [ $(( $(date +%s) - $(date -d "$age" +%s) )) -gt 600 ]; then
                  gh api -X POST "repos/${{ github.repository }}/pages/deployments/$sha/cancel" && echo "Zrušeno zaseknuté nasazení $sha ($st)"
                fi;;
            esac
          done

      - name: Zveřejnit web
        if: always() && hashFiles('data.enc') != ''
        run: |
          mkdir -p pub/docs && cp web/* data.enc pub/ && cp docs/*.md CHANGELOG.md pub/docs/ && touch pub/.nojekyll
          cd pub && git init -q -b gh-pages && git add -A
          git -c user.name=hlidac-bot -c user.email=hlidac-bot@users.noreply.github.com commit -qm data
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
